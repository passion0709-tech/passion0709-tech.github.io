<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TikTok 연결 | 사장님 콘텐츠 팩토리</title>
<style>
  :root { --bg:#ffffff; --fg:#1a1a1a; --muted:#5f6368; --line:#e5e7eb; --accent:#ff6b2c; --card:#f8f9fa; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111214; --fg:#ececec; --muted:#a0a4ab; --line:#2a2d31; --card:#1a1c1f; } }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; line-height:1.7; }
  main { max-width:640px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:1.5rem; margin:0 0 8px; }
  p { color:var(--muted); }
  .box { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; font-family:Consolas, monospace; word-break:break-all; margin:12px 0; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:1rem; cursor:pointer; }
  .err { color:#d93025; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>TikTok 연결</h1>
  <div id="out"><p>확인 중...</p></div>
  <p style="margin-top:32px;font-size:.9rem">사장님 콘텐츠 팩토리 · <a href="privacy.html">개인정보처리방침</a> · <a href="terms.html">이용약관</a></p>
</main>
<script>
  // 이 페이지는 받은 인증 코드를 화면에만 보여 줍니다. 어떤 서버로도 전송하지 않습니다.
  (function () {
    var q = new URLSearchParams(location.search);
    var out = document.getElementById('out');
    var esc = function (s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
    if (q.get('error')) {
      out.innerHTML = '<p class="err">연결이 취소되었거나 실패했습니다: ' + esc(q.get('error')) + '</p><p>' + esc(q.get('error_description') || '') + '</p>';
      return;
    }
    var code = q.get('code');
    if (!code) {
      out.innerHTML = '<p>이 페이지는 TikTok 로그인 후 자동으로 열리는 연결 확인 페이지입니다.</p>';
      return;
    }
    out.innerHTML =
      '<p>연결 승인이 완료되었습니다. 아래 전체 주소를 복사해 검은 창(명령 프롬프트)에 붙여넣으세요.</p>' +
      '<div class="box" id="url">' + esc(location.href) + '</div>' +
      '<button id="copy">주소 복사</button> <span id="msg"></span>' +
      '<p style="margin-top:16px">이 코드는 몇 분 안에 만료되며 한 번만 쓸 수 있습니다. 다른 사람에게 보내지 마세요.</p>';
    document.getElementById('copy').onclick = function () {
      navigator.clipboard.writeText(location.href).then(function () {
        document.getElementById('msg').textContent = '복사됨';
      });
    };
  })();
</script>
</body>
</html>
